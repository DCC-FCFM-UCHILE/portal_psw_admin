services:
    django:
        networks:
            - nginx-proxy
        container_name: portal-admin-psw
        hostname: ${DESPLIEGUE_HOSTNAME:-adminpsw.apps.dcc.uchile.cl}
        build:
            context: ../
            dockerfile: .docker/app/Dockerfile
            target: production
            args:
                UID: ${DESPLIEGUE_UID:-1001}
                GID: ${DESPLIEGUE_GID:-100}
        command: [ "sh", "-c", "python manage.py collectstatic --noinput && gunicorn --workers=2 --threads=4 --worker-class=gthread --worker-tmp-dir /dev/shm --bind :8000 core.wsgi" ]
        volumes:
            - ${DESPLIEGUE_ESTATICOS:-/home/instalar/static/portal-admin-psw/}:/static/:rw
            - ${DESPLIEGUE_ARCHIVOS:-/home/instalar/media/portalpsw2/}:/media/:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        expose:
            - 8000
        healthcheck:
            test: [ "CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000' + os.environ.get('SCRIPT_NAME', '') + '/ingresar/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=5)" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        env_file:
            - app/.env
        environment:
            # Prefijo de ruta cuando el portal no vive en la raíz del dominio (p. ej. /portal-psw
            # en test.dcc.uchile.cl). Lo lee gunicorn: la cabecera SCRIPT_NAME la descarta.
            SCRIPT_NAME: ${DESPLIEGUE_PREFIJO:-}
        restart: always

networks:
    nginx-proxy:
      external: true
      name: ${DESPLIEGUE_RED:-nginx-proxy}
