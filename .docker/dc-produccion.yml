services:
    django:
        networks:
            - nginx-proxy
        container_name: portal-admin-psw
        hostname: portal-admin-psw.apps.dcc.uchile.cl
        build: 
            context: ../
            dockerfile: .docker/app/Dockerfile
            target: production
            args:
                UID: 1001
                GID: 100
        command: [ "sh", "-c", "python manage.py collectstatic --noinput && gunicorn --workers=2 --threads=4 --worker-class=gthread --worker-tmp-dir /dev/shm --env SCRIPT_NAME=/portal-admin --bind :8000 core.wsgi" ]
        volumes:
            - /home/instalar/static/portal-admin-psw/:/static/:rw
            - /home/instalar/media/portalpsw2/:/media/:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        expose:
            - 8000
        env_file:
            - app/.env
        restart: always

networks:
    nginx-proxy:
      external: true
      name: nginx-proxy
