services:
    django:
        networks:
            - nginx-proxy
        container_name: portal-admin-psw
        hostname: adminpsw.apps.dcc.uchile.cl
        build:
            context: ../
            dockerfile: .docker/app/Dockerfile
            target: production
            args:
                UID: 1001
                GID: 100
        command: [ "sh", "-c", "python manage.py collectstatic --noinput && gunicorn --workers=2 --threads=4 --worker-class=gthread --worker-tmp-dir /dev/shm --bind :8000 core.wsgi" ]
        volumes:
            - /home/instalar/static/portal-admin-psw/:/static/:rw
            - /home/instalar/media/portalpsw2/:/media/:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        expose:
            - 8000
        healthcheck:
            test: [ "CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/ingresar/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=5)" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        env_file:
            - app/.env
        restart: always

networks:
    nginx-proxy:
      external: true
      name: nginx-proxy
