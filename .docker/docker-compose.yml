services:
    django:
        container_name: portal-admin-psw
        build:
            context: ../
            dockerfile: .docker/app/Dockerfile
            target: develop
        command: [ "sh", "-c", "python manage.py runserver 0.0.0.0:8000 --settings=core.settings.docker" ]
        tty: true
        stdin_open: true
        restart: always
        volumes:
            - ../app/:/app/:cached
            - ${MEDIA_PUBLICO:-../../portal_psw_mobile/app/_media}/:/media/:cached
            - ../app/_staticfiles/:/static/:cached
        ports:
            - 8003:8000
        env_file: ./app/.env

    tailwind:
        container_name: portal-admin-tailwind
        build:
            context: ../
            dockerfile: .docker/app/Dockerfile
            target: develop
        command: [ "sh", "-c", "npm install && npx -y nodemon -L --watch ../ --ignore ../_staticfiles/unfold/ --ignore scss/unfold.css --ext html,css,js,py --exec 'npm run tailwind-build'" ]
        working_dir: /app/_node
        tty: true
        volumes:
            - ../app/:/app/:cached
            - /app/_node/node_modules/
        restart: always
        depends_on:
            - django

networks:
    default:
        name: ${RED_PUBLICO:-portal-publico-psw_default}
        external: true
