{% load unfold %}

<div class="relative z-60">
    <div class="envoltura-lateral fixed xl:relative {% element_classes 'navigation_wrapper' %}" x-show="sidebarOpen" x-bind:style="`width: ${sidebarWidth}px`">
        <div class="fixed inset-0 bg-black/50 xl:hidden" x-on:click="sidebarToggle()" aria-hidden="true"></div>
        <div id="nav-sidebar" class="lateral fixed bottom-0 top-0 max-h-screen {% element_classes 'navigation' %}" x-bind:style="`width: ${sidebarWidth}px`" x-trap.inert.noscroll.noautofocus="sidebarOpen === true && window.innerWidth < 1280" x-on:keydown.escape.window="if (sidebarOpen && window.innerWidth < 1280) { sidebarToggle(); $nextTick(() => document.getElementById('alternar-menu')?.focus()) }">
            {% include "unfold/helpers/navigation.html" %}
        </div>
    </div>
</div>
