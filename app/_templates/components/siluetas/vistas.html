<div class="silueta-vista" aria-hidden="true" data-forma="inicio" data-titulo="el inicio">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div class="min-w-0 space-y-2">
            <div class="silueta-bloque h-7 w-48 max-w-full rounded"></div>
            <div class="silueta-bloque h-4 w-80 max-w-full rounded"></div>
        </div>
        <div class="flex flex-wrap gap-3">
            <div class="silueta-bloque h-10 w-36 rounded-default"></div>
            <div class="silueta-bloque h-10 w-44 rounded-default"></div>
        </div>
    </div>
    <div class="mt-6 grid grid-cols-[repeat(auto-fit,minmax(min(14rem,100%),1fr))] gap-4">
        {% for i in "1234" %}
            <div class="tarjeta flex items-center justify-between gap-4 px-5 py-4">
                <div class="min-w-0 flex-1 space-y-3">
                    <div class="silueta-bloque h-3 w-32 max-w-full rounded"></div>
                    <div class="silueta-bloque h-6 w-12 rounded"></div>
                </div>
                <div class="silueta-bloque size-10 shrink-0 rounded-full"></div>
            </div>
        {% endfor %}
    </div>
    <div class="mt-6 grid gap-6 lg:grid-cols-[3fr_2fr]">
        <div class="tarjeta">
            <div class="border-b border-base-200 px-5 py-4 dark:border-base-800">
                <div class="silueta-bloque h-4 w-36 rounded"></div>
            </div>
            <div class="px-5 py-4">
                <div class="silueta-bloque h-4 w-3/4 rounded"></div>
            </div>
        </div>
        <div class="tarjeta">
            <div class="border-b border-base-200 px-5 py-4 dark:border-base-800">
                <div class="silueta-bloque h-4 w-32 rounded"></div>
            </div>
            <div class="space-y-5 px-5 py-4">
                {% for i in "123" %}
                    <div class="silueta-bloque h-4 w-48 max-w-full rounded"></div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<div class="silueta-vista" aria-hidden="true" data-forma="listado" data-titulo="el listado">
    <div class="mb-4 flex flex-wrap gap-2">
        {% for i in "1234" %}
            <div class="silueta-bloque h-8 w-24 rounded-full"></div>
        {% endfor %}
    </div>
    <div class="tarjeta overflow-hidden">
        <div class="flex flex-wrap items-center justify-between gap-3 p-3">
            <div class="silueta-bloque h-9 w-96 max-w-full rounded-default"></div>
            <div class="silueta-bloque h-9 w-24 rounded-default"></div>
        </div>
        <div class="border-t border-base-200 px-3 py-3 dark:border-base-800">
            <div class="silueta-bloque h-4 w-2/3 rounded"></div>
        </div>
        {% include "components/siluetas/filas.html" %}
    </div>
</div>

<div class="silueta-vista" aria-hidden="true" data-forma="ficha" data-titulo="la ficha">
    <div class="tarjeta">
        {% for i in "1234567" %}
            <div class="flex flex-col gap-2 border-base-200 px-3 py-4 md:flex-row md:items-center md:gap-6 dark:border-base-800{% if not forloop.first %} border-t{% endif %}">
                <div class="silueta-bloque h-4 w-28 shrink-0 rounded md:w-48"></div>
                <div class="silueta-bloque h-9 w-full rounded-default md:max-w-2xl"></div>
            </div>
        {% endfor %}
    </div>
</div>
