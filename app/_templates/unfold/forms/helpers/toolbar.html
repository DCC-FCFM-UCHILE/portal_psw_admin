{% load i18n %}

<template id="trix-toolbar">
    <div role="group" aria-label="Formato del mensaje" class="flex flex-row flex-wrap mb-3 gap-4 relative w-full">
        <div data-trix-button-group="text-tools" class="bg-white border border-base-200 border-md flex flex-row rounded-default shadow-xs shrink-0 dark:bg-base-900 dark:border-base-700">
            {% spaceless %}
                <button type="button" data-trix-attribute="p" data-trix-key="p" title="Párrafo" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_paragraph</span>
                    <span class="sr-only">Párrafo</span>
                </button>

                <button type="button" data-trix-attribute="underlined" data-trix-key="u" title="Subrayado" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_underlined</span>
                    <span class="sr-only">Subrayado</span>
                </button>

                <button type="button" data-trix-attribute="bold" data-trix-key="b" title="Negrita" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_bold</span>
                    <span class="sr-only">Negrita</span>
                </button>

                <button type="button" data-trix-attribute="italic" data-trix-key="i" title="Cursiva" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_italic</span>
                    <span class="sr-only">Cursiva</span>
                </button>

                <button type="button" data-trix-attribute="strike" title="Tachado" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_strikethrough</span>
                    <span class="sr-only">Tachado</span>
                </button>

                <button type="button" data-trix-attribute="href" data-trix-action="link" data-trix-key="k" title="Enlace" class="flex cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600">
                    <span class="material-symbols-outlined" aria-hidden="true">link</span>
                    <span class="sr-only">Enlace</span>
                </button>
            {% endspaceless %}
        </div>

        <div data-trix-button-group="block-headings" class="bg-white border border-base-200 border-md flex flex-row rounded-default shadow-xs dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark">
            {% spaceless %}
                <button type="button" data-trix-attribute="heading1" title="Título 1" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_h1</span>
                    <span class="sr-only">Título 1</span>
                </button>

                <button type="button" data-trix-attribute="heading2" title="Título 2" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_h2</span>
                    <span class="sr-only">Título 2</span>
                </button>

                <button type="button" data-trix-attribute="heading3" title="Título 3" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_h3</span>
                    <span class="sr-only">Título 3</span>
                </button>

                <button type="button" data-trix-attribute="heading4" title="Título 4" class="cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_h4</span>
                    <span class="sr-only">Título 4</span>
                </button>
            {% endspaceless %}
        </div>

        <div data-trix-button-group="block-tools" class="bg-white border border-base-200 border-md flex flex-row rounded-default shadow-xs dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark">
            {% spaceless %}
                <button type="button" data-trix-attribute="quote" title="Cita" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_quote</span>
                    <span class="sr-only">Cita</span>
                </button>

                <button type="button" data-trix-attribute="code" title="Código" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">code</span>
                    <span class="sr-only">Código</span>
                </button>

                <button type="button" data-trix-attribute="bullet" title="Lista con viñetas" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span>
                    <span class="sr-only">Lista con viñetas</span>
                </button>

                <button type="button"  data-trix-attribute="number" title="Lista numerada" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_list_numbered</span>
                    <span class="sr-only">Lista numerada</span>
                </button>

                <button type="button" data-trix-action="increaseNestingLevel" title="Aumentar sangría" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">format_indent_increase</span>
                    <span class="sr-only">Aumentar sangría</span>
                </button>

                <button type="button" data-trix-action="decreaseNestingLevel" title="Reducir sangría" class="cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600">
                    <span class="material-symbols-outlined" aria-hidden="true">format_indent_decrease</span>
                    <span class="sr-only">Reducir sangría</span>
                </button>
            {% endspaceless %}
        </div>

        <div class="lg:ml-auto">
            <div data-trix-button-group="history-tools" class="bg-white border border-base-200 border-md flex flex-row rounded-default shadow-xs dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark">
                <button type="button" data-trix-action="undo" data-trix-key="z" title="Deshacer" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600 dark:border-base-700">
                    <span class="material-symbols-outlined" aria-hidden="true">undo</span>
                    <span class="sr-only">Deshacer</span>
                </button>

                <button type="button" data-trix-action="redo" data-trix-key="shift+z" title="Rehacer" class="cursor-pointer flex items-center h-8 justify-center w-8 hover:text-primary-600">
                    <span class="material-symbols-outlined" aria-hidden="true">redo</span>
                    <span class="sr-only">Rehacer</span>
                </button>
            </div>

            <div data-trix-dialogs>
                <div class="absolute bg-white border-b border-base-200 -bottom-px left-0 px-4 py-2 right-0 shadow-xs translate-y-full dark:bg-base-900 dark:border-base-700" data-trix-dialog="href" data-trix-dialog-attribute="href">
                    <div class="flex flex-row">
                        <input type="url" name="href" class="border border-base-200 bg-white font-medium px-3 rounded-default shadow-xs text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 group-[.errors]:border-red-600 focus:group-[.errors]:outline-red-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark dark:group-[.errors]:border-red-500 dark:focus:group-[.errors]:outline-red-500" placeholder="https://" aria-label="Dirección del enlace" required data-trix-input>

                        <div class="bg-white border border-base-200 border-md flex flex-row ml-4 rounded-default shadow-xs dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark">
                            <button type="button" data-trix-method="setAttribute" title="Enlace" class="border-r border-base-200 cursor-pointer flex items-center h-8 justify-center text-gris-medio w-8 hover:text-primary-600 dark:text-oscuro-suave dark:border-base-700">
                                <span class="material-symbols-outlined" aria-hidden="true">link</span>
                                <span class="sr-only">Enlace</span>
                            </button>

                            <button type="button" data-trix-method="removeAttribute" title="Quitar el enlace" class="cursor-pointer flex items-center h-8 justify-center text-gris-medio w-8 hover:text-primary-600 dark:text-oscuro-suave dark:border-base-700">
                                <span class="material-symbols-outlined" aria-hidden="true">link_off</span>
                                <span class="sr-only">Quitar el enlace</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
