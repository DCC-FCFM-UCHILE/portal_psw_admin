{% load i18n %}

{% if widget.attrs.accept == 'image/*' and widget.is_initial %}
    <div class="mb-4 max-w-48">
        <a href="{{ widget.value.url }}" target="_blank" rel="noopener">
            <img src="{{ widget.value.url }}" alt="Imagen actual (se abre en otra pestaña)" class="block rounded-default" />
        </a>
    </div>
{% endif %}

<div class="campo-archivo-unfold {{ widget.file_wrapper_class }}">
    {% if widget.is_initial and not widget.required %}
        <div class="bg-base-50 border-r border-base-200 flex flex-none items-center self-stretch px-3 dark:bg-white/[.02] dark:border-base-700 dark:text-font-default-dark">
            <label for="{{ widget.checkbox_id }}" class="flex items-center">
                <input type="checkbox"{% if widget.class %} class="{{ widget.class }}"{% endif %} name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" />

                <span class="ml-2">
                    {{ widget.clear_checkbox_label }}
                </span>
            </label>
        </div>
    {% endif %}

    <label for="{{ widget.attrs.id }}" class="flex grow relative">
        <input type="text" aria-label="{% trans 'Choose file to upload' %}" value="{% if widget.value %}{{ widget.value.url }}{% else %}{% trans 'Choose file to upload' %}{% endif %}" disabled class="grow font-medium min-w-0 px-3 py-2 text-ellipsis">
        <span class="absolute cursor-pointer left-0 bottom-0 top-0 right-0"></span>
    </label>

    <div class="bg-white flex flex-none items-center leading-none self-stretch dark:bg-base-900">
        <div class="opacity-0 overflow-hidden w-[0px]">
            <input type="{{ widget.type }}" name="{{ widget.name }}" {% include "django/forms/widgets/attrs.html" %} />
        </div>

        {% if widget.is_initial %}
            <a href="{{ widget.value.url }}" class="flex min-w-10 cursor-pointer items-center justify-center self-stretch border-r border-base-200 px-3 text-gris-medio hover:text-gris-oscuro dark:border-base-700 dark:text-oscuro-suave dark:hover:text-oscuro-texto" target="_blank" rel="noopener">
                <span class="block material-symbols-outlined" aria-hidden="true">download</span>
                <span class="sr-only">Descargar el archivo actual (se abre en otra pestaña)</span>
            </a>
        {% endif %}

        <label for="{{ widget.attrs.id }}" class="flex min-w-10 cursor-pointer items-center justify-center self-stretch px-3 text-gris-medio hover:text-gris-oscuro dark:text-oscuro-suave dark:hover:text-oscuro-texto">
            <span class="block material-symbols-outlined" aria-hidden="true">upload</span>
            <span class="sr-only">Elegir otro archivo</span>
        </label>
    </div>
</div>
