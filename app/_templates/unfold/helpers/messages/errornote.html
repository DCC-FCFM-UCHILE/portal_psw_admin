{% load i18n %}

{% if errors %}
    {% if errors|length != 1 or not adminform.form.non_field_errors %}
        <p class="errornote bg-red-100 mb-4 text-red-700 px-3 py-2.5 leading-[18px] rounded-default dark:bg-red-500/20 dark:border-red-500/20 dark:text-red-400 {% if class %} {{ class }}{% endif %}">
            {% blocktranslate count counter=errors|length %}Please correct the error below.{% plural %}Please correct the errors below.{% endblocktranslate %}
        </p>
    {% endif %}
{% endif %}
