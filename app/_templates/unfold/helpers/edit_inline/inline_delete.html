{% if inline_admin_formset.formset.can_delete and inline_admin_formset.has_delete_permission %}
    {% if inline_admin_form.original %}
        <label class="boton-campo boton-quitar-fila">
            <span class="material-symbols-outlined md-18 quitar" aria-hidden="true">delete</span>
            <span class="material-symbols-outlined md-18 deshacer" aria-hidden="true">undo</span>
            {% with casilla=inline_admin_form.deletion_field.field %}
                <input type="checkbox" name="{{ casilla.html_name }}" id="{{ casilla.auto_id }}" class="delete sr-only" aria-label="Quitar {{ inline_admin_form.original }}"{% if casilla.value %} checked{% endif %}>
            {% endwith %}
        </label>
    {% else %}
        <button type="button" class="delete-template boton-campo boton-quitar-fila">
            <span class="material-symbols-outlined md-18" aria-hidden="true">delete</span>
            <span class="sr-only">Quitar esta fila</span>
        </button>
    {% endif %}
{% endif %}
