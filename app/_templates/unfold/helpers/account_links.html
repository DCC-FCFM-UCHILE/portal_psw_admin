{% if site_url %}
    <a href="{{ site_url }}" target="_blank" rel="noopener" class="mx-1 flex min-h-10 items-center rounded-md px-3 py-2 hover:bg-base-100 dark:hover:bg-base-700">
        Ver el portal público<span class="sr-only"> (se abre en otra pestaña)</span>
    </a>
{% endif %}

{% for link in account_links %}
    <a href="{{ link.link }}" class="mx-1 flex min-h-10 items-center rounded-md px-3 py-2 hover:bg-base-100 dark:hover:bg-base-700">{{ link.title }}</a>
{% empty %}
    {% if user.has_usable_password %}
        <a href="{% url 'admin:password_change' %}" class="mx-1 flex min-h-10 items-center rounded-md px-3 py-2 hover:bg-base-100 dark:hover:bg-base-700">Cambiar la contraseña</a>
    {% endif %}
{% endfor %}

<div class="mt-1 border-t border-base-200 pt-1 dark:border-base-700">
    <form id="logout-form" method="post" action="{% url 'admin:logout' %}" class="mx-1">
        {% csrf_token %}
        <button type="submit" class="flex min-h-10 w-full cursor-pointer items-center rounded-md px-3 py-2 text-left text-rojo hover:bg-red-50 dark:text-red-300 dark:hover:bg-red-500/20">
            Cerrar sesión <span class="material-symbols-outlined ml-auto" aria-hidden="true">logout</span>
        </button>
    </form>
</div>
